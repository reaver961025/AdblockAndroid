name: Build & Release

# Builds the library AARs (and best-effort the sample APK) on every manual run,
# and on tag pushes (v*) also creates a GitHub Release with the compiled AARs attached.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required by softprops/action-gh-release to create the release

jobs:
  build:
    name: Build AAR / APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ubuntu-latest ships the Android SDK at /usr/local/lib/android/sdk with
      # sdkmanager already available. We accept licenses non-interactively and
      # install the exact platform / build-tools / NDK / CMake we pin in the
      # build files (avoids the buggy setup-android@v3 license handling).
      - name: Configure Android SDK (licenses + platform/build-tools/NDK/CMake)
        run: |
          set -e
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$PATH"
          echo "sdkmanager: $(command -v sdkmanager)"
          yes | sdkmanager --licenses > /tmp/licenses.log 2>&1 || true
          echo "--- license acceptance tail ---"
          tail -n 4 /tmp/licenses.log || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build library AARs (adblock-client + ad-filter)
        run: ./gradlew :adblock-client:assembleRelease :ad-filter:assembleRelease --no-daemon --stacktrace

      - name: Build sample APK (best-effort, non-blocking)
        continue-on-error: true
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp adblock-client/build/outputs/aar/*.aar artifacts/ 2>/dev/null || true
          cp ad-filter/build/outputs/aar/*.aar artifacts/ 2>/dev/null || true
          cp app/build/outputs/apk/debug/*universal*.apk artifacts/ 2>/dev/null || true
          echo "=== artifacts ==="
          ls -la artifacts

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adblockandroid-build
          path: artifacts/*
          if-no-files-found: error

      - name: Create GitHub Release with the library AARs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.aar
            artifacts/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
