apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'
apply plugin: 'kotlin-kapt'

android {
    compileSdk 34

    defaultConfig {
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // BuildConfig is referenced in source (ScriptInjection.kt uses BuildConfig.DEBUG);
    // AGP 8 disables it by default for libraries — re-enable it explicitly.
    buildFeatures {
        buildConfig = true
    }

    packagingOptions {
        pickFirst 'META-INF/AL2.0'
        pickFirst 'META-INF/LGPL2.1'
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation libs.bundles.androidx.base
    testImplementation libs.bundles.test.base
    androidTestImplementation libs.bundles.androidtest.base

    implementation project(':adblock-client')

    implementation libs.timber
    implementation libs.kotlinx.coroutines.core
    androidTestImplementation libs.kotlinx.coroutines.test
    implementation libs.kotlinx.serialization.json
    implementation libs.androidx.work.runtime.ktx

    implementation libs.edsuns.httprequest

    implementation libs.edsuns.mezzanine
    kapt libs.edsuns.mezzanine.compiler
}

kapt {
    arguments {
        arg("mezzanine.projectPath", projectDir)
    }
}
