apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "io.github.edsuns.adblockclient"
    compileSdk 34

    // Pinned for reproducible native builds (matches the versions installed in CI).
    ndkVersion = "26.3.11579264"

    defaultConfig {
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "2.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"

        externalNativeBuild {
            cmake {
                // Match the ABIs shipped by the sample app.
                abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            // Pinned to the CMake version installed by the SDK manager / CI.
            // (The old "3.10.2" pin is no longer downloadable.)
            version = "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation libs.bundles.androidx.base
    testImplementation libs.bundles.test.base
    androidTestImplementation libs.bundles.androidtest.base

    implementation libs.timber
}
